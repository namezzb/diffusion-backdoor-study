<text x="52.0" y="347.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" font-style="normal" fill="#2d3746" text-anchor="start">- K/V receives dominant hijack budget (||dW_KV||_F &gt; ||dW_QO||_F)</text>
<text x="52.0" y="368.0" font-family="Helvetica, Arial, sans-serif" font-size="11.0" font-weight="normal" font-style="normal" fill="#2d3746" text-anchor="start">- Q/O capped at qo_max_ratio &lt;= 0.50 to prevent dilution</text>
